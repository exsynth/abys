name: coverage

on:
  push:
    branches:
      - main
  pull_request:

env:
  SLANG_RELEASE_TAG: slang-ubuntu-2026-08-04
  SLANG_TARBALL_SHA256: 03946a2270d78dbb73bc46f7b84b0bc8b735be6f3b0f368bb47c9a823ec50bc1

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
      - name: Cache slang (prebuilt)
        uses: actions/cache@v5
        with:
          path: _slang
          key: ${{ env.SLANG_RELEASE_TAG }}-${{ env.SLANG_TARBALL_SHA256 }}
      - name: Fetch slang (prebuilt)
        run: |
          if [ -d _slang/lib/cmake/slang ]; then
            echo "Using cached slang package"
            exit 0
          fi
          mkdir -p _slang
          curl -L -o slang-ubuntu-latest.tar.gz \
            https://github.com/exsynth/slang/releases/download/${SLANG_RELEASE_TAG}/slang-ubuntu-latest.tar.gz
          if [ -n "${SLANG_TARBALL_SHA256:-}" ]; then
            echo "${SLANG_TARBALL_SHA256}  slang-ubuntu-latest.tar.gz" | sha256sum --check
          fi
          tar -xzf slang-ubuntu-latest.tar.gz -C _slang
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DABYS_ENABLE_COVERAGE=ON -Dslang_DIR="$PWD/_slang/lib/cmake/slang"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: |
          gcovr -r . \
            --filter "$PWD/src/" \
            --filter "$PWD/include/" \
            --xml -o build/coverage.xml
          gcovr -r . \
            --filter "$PWD/src/" \
            --filter "$PWD/include/" \
            --html --html-details -o build/coverage.html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          disable_search: true
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage.xml
            build/coverage.html
